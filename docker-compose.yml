services:

  # ── Web Server ────────────────────────────────────────────────────────────────
  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: food_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/backend:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php-fpm
      - frontend
      - admin
      - mock-erp
    networks:
      - food_net

  # ── PHP-FPM (Laravel API) ──────────────────────────────────────────────────────
  php-fpm:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      target: development
    container_name: food_php_fpm
    restart: unless-stopped
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - food_net

  # ── MySQL 8 ───────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: food_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootsecret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-food_db}
      MYSQL_USER: ${MYSQL_USER:-food}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-foodsecret}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - food_net

  # ── Redis ──────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: food_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redissecret}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redissecret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - food_net

  # ── Queue Worker ───────────────────────────────────────────────────────────────
  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      target: development
    container_name: food_queue
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - food_net

  # ── Scheduler ─────────────────────────────────────────────────────────────────
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
      target: development
    container_name: food_scheduler
    restart: unless-stopped
    command: ["/bin/sh", "-c", "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"]
    volumes:
      - ./backend:/var/www/backend
      - backend_vendor:/var/www/backend/vendor
    env_file:
      - ./backend/.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - food_net

  # ── Vue 3 Frontend (customer) ──────────────────────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: food_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost/api
    networks:
      - food_net

  # ── Vue 3 Admin ────────────────────────────────────────────────────────────────
  admin:
    image: node:20-alpine
    container_name: food_admin
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    volumes:
      - ./admin:/app
      - admin_node_modules:/app/node_modules
    ports:
      - "5174:5174"
    environment:
      - VITE_API_BASE_URL=http://localhost/api
    networks:
      - food_net

  # ── Mock ERP / POS ─────────────────────────────────────────────────────────────
  mock-erp:
    build:
      context: ./mock-erp
      dockerfile: Dockerfile
    container_name: food_mock_erp
    restart: unless-stopped
    volumes:
      - ./mock-erp/src:/app/src
    ports:
      - "3000:3000"
    networks:
      - food_net

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  food_net:
    driver: bridge

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
  admin_node_modules:
