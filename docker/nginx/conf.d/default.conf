upstream php_fpm {
    server php-fpm:9000;
}

upstream vue_frontend {
    server frontend:5173;
}

upstream vue_admin {
    server admin:5174;
}

upstream mock_erp {
    server mock-erp:3000;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/backend/public;
    index index.php;

    # /api → Laravel via FastCGI
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass   php_fpm;
        fastcgi_index  index.php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $realpath_root;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_param  HTTP_X_REAL_IP  $remote_addr;
        fastcgi_read_timeout 120;
        internal;
    }

    # Deny direct PHP file access
    location ~ \.php$ {
        return 404;
    }

    # 使用者上傳的圖片（菜單照片…）：只讀的 named volume，由 nginx 直接提供，不經過 PHP。
    # ^~ 讓這個前綴優先於上面的正規表示式，並且這裡沒有任何 fastcgi 設定，檔案只會被當成靜態檔案送出，
    # 就算有人設法放進奇怪的檔案也不會被執行。上傳的檔案一律是伺服器重新編碼過的 WebP。
    location ^~ /uploads/ {
        alias /var/www/uploads/;
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
        # 禁止瀏覽器猜測檔案類型（防止把圖片當成腳本執行）
        add_header X-Content-Type-Options "nosniff" always;
        autoindex off;
    }

    # /mock-erp → Node.js Express
    location /mock-erp {
        rewrite ^/mock-erp(/.*)$ $1 break;
        proxy_pass         http://mock_erp;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # /admin → Vue admin Vite dev server
    # Vite 設了 base: '/admin/'，dev server 本身就在 /admin/ 底下服務，
    # 所以「不能」把 /admin 前綴 rewrite 掉，原樣轉發即可。
    location = /admin {
        return 301 /admin/;
    }

    location /admin/ {
        proxy_pass         http://vue_admin;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Vite HMR WebSocket for admin
    location /admin-ws {
        proxy_pass         http://vue_admin;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
    }

    # / → Vue customer frontend Vite dev server
    location / {
        proxy_pass         http://vue_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Vite HMR WebSocket for frontend
    location /__vite_hmr {
        proxy_pass         http://vue_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
    }
}
