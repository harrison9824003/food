upstream php_fpm {
    server php-fpm:9000;
}

upstream vue_frontend {
    server frontend:5173;
}

upstream vue_admin {
    server admin:5174;
}

upstream mock_erp {
    server mock-erp:3000;
}

server {
    listen 80;
    server_name localhost;

    root /var/www/backend/public;
    index index.php;

    # /api → Laravel via FastCGI
    location /api {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass   php_fpm;
        fastcgi_index  index.php;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include        fastcgi_params;
        fastcgi_param  SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param  DOCUMENT_ROOT   $realpath_root;
        fastcgi_param  PATH_INFO       $fastcgi_path_info;
        fastcgi_param  HTTP_X_REAL_IP  $remote_addr;
        fastcgi_read_timeout 120;
        internal;
    }

    # Deny direct PHP file access
    location ~ \.php$ {
        return 404;
    }

    # /mock-erp → Node.js Express
    location /mock-erp {
        rewrite ^/mock-erp(/.*)$ $1 break;
        proxy_pass         http://mock_erp;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # /admin → Vue admin Vite dev server
    location /admin {
        rewrite ^/admin(/.*)$ $1 break;
        proxy_pass         http://vue_admin;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Vite HMR WebSocket for admin
    location /admin-ws {
        proxy_pass         http://vue_admin;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
    }

    # / → Vue customer frontend Vite dev server
    location / {
        proxy_pass         http://vue_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Vite HMR WebSocket for frontend
    location /__vite_hmr {
        proxy_pass         http://vue_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "Upgrade";
        proxy_set_header   Host $host;
    }
}
